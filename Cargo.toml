[package]
name = "fepc"
version = "0.1.0"
edition = "2024"
authors = ["code-leitianshuo (leitianshuo1337)"]
publish = false

[dependencies]
fluent-egui = { version = "0.1.1", features = ["windows-platform", "glow"] }
resolver = { path = "../ets_resolver" }
cloud = { path = "../ets_resolver/cloud" }
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.35.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
ureq = { version = "2", features = ["tls", "json"] }
base64 = "0.22"
encoding_rs = "0.8"
md-5 = "0.10"
rfd = "0.15"
arboard = "3.6"
open = "5.3"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Registry"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
oldwin = { version = "0.1.3", features = ["win7", "yy-thunks"] }
oldwin-platform-yy-thunks-x86_64-win7 = "0.1.1"

[package]
name = "fepc"
version = "0.1.6"
edition = "2024"
authors = ["code-leitianshuo (leitianshuo1337)"]
publish = false

[dependencies]
fluent-egui = { path = "../fluent-egui", features = ["windows-platform", "glow"] }
resolver = { path = "../ets_resolver" }
cloud = { path = "../ets_resolver/cloud" }
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.35.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
ureq = { version = "2", features = ["tls", "json"] }
base64 = "0.22"
encoding_rs = "0.8"
md-5 = "0.10"
rfd = "0.15"
arboard = "3.6"
open = "5.3"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Registry"] }
msedge-tts = "0.4.0"
uuid = { version = "1.26.1", features = ["v4"] }
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
flate2 = "1.0"
regex = "1.13"
ring = "0.17"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
oldwin = { version = "0.1.3", features = ["win7", "yy-thunks"] }
oldwin-platform-yy-thunks-x86_64-win7 = "0.1.1"

[lints.rust]
unknown_lints = "allow"

[lints.clippy]
collapsible_if = "allow"
chunks_exact_to_as_chunks = "allow"
manual_unwrap_or_default = "allow"
